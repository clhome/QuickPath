name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release for Windows
    runs-on: windows-latest
    # 稳定版发布需在仓库 Settings → Environments 中为 release 配置审批人/保护规则；
    # 预发布（-rc/-alpha/-beta）不发放稳定产物。
    environment: release

    steps:
      # 所有第三方 Action 一律锁定到完整 commit SHA（报告 P2-02），
      # 避免上游 tag 被移动/劫持后 CI 执行到非预期代码。
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── 阻塞式版本一致性门禁（报告 M-01）──────────────────────────────────
      # 本 workflow 由 `push: tags: ['v*']` 触发，`github.ref_name` 就是标签名。
      # 在编译之前比较标签版本与 Cargo.toml 的单一版本源，杜绝「标签是新版本、
      # 产物却标旧版本」这类元数据漂移；不一致直接 exit 1 让发布变红。
      # 预发布后缀口径与下方「判定发布通道」步骤一致（-rc/-alpha/-beta/-pre）。
      - name: 门禁：标签版本与 Cargo.toml 一致
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # 去掉前导 v，并剥离预发布后缀（与「判定发布通道」步骤同一口径）
          $tagVersion = ($tag -replace '^v', '') -replace '(?i)(-rc|-alpha|-beta|-pre).*$', ''

          if (-not (Test-Path Cargo.toml)) {
            Write-Error "未找到 Cargo.toml，无法校验标签版本"
            exit 1
          }
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            Write-Error "无法从 Cargo.toml 解析 [package] version"
            exit 1
          }
          $pkgVersion = $Matches[1]

          if ($tagVersion -ne $pkgVersion) {
            Write-Error "标签版本与 Cargo.toml 不一致：标签 $tag 解析为 $tagVersion，Cargo.toml 为 $pkgVersion"
            exit 1
          }
          Write-Host "版本一致：标签 $tag，Cargo.toml $pkgVersion"

      - name: 安装固定版本 Rust 工具链
        shell: pwsh
        # 不使用跟随 stable 浮动的工具链 Action：显式锁死 Rust 版本与组件，
        # 保证同一 tag 在任何时间重跑都得到一致工具链。
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
          rustup default 1.94.1
          rustc -V
          cargo -V

      - name: 启用 Rust 编译缓存
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: 质量门禁：执行单元与集成测试
        run: cargo test --all-targets

      # ── 阻塞式质量门禁 ────────────────────────────────────────────────────
      # 仓库已完成全仓 `cargo fmt` 与 clippy 告警治理(0 告警),因此这三条门禁
      # 现在必须阻塞发布:任一失败即中止,不允许带格式/告警/漏洞的产物上线。
      - name: 门禁：格式检查
        run: cargo fmt --all -- --check

      - name: 门禁：Clippy（0 告警）
        run: cargo clippy --all-targets -- -D warnings

      - name: 门禁：依赖安全审计
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: 编译 Release 版本
        run: cargo build --release

      - name: 判定发布通道（含 -rc/-alpha/-beta/-pre 的标签为预发布）
        id: channel
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '(?i)(-rc|-alpha|-beta|-pre)') {
            "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }

      - name: 整理打包产物与生成 SHA-256 清单
        shell: pwsh
        run: |
          $TAG_NAME = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path "dist"

          # 复制并生成规范命名的独立 exe
          Copy-Item "target/release/quickpath.exe" "dist/QuickPath-$TAG_NAME-x64.exe"
          Copy-Item "target/release/quickpath.exe" "dist/QuickPath.exe"

          # 生成便携压缩包
          Compress-Archive -Path "dist/QuickPath.exe" -DestinationPath "dist/QuickPath-$TAG_NAME-windows-x64.zip"

          # 生成严谨的 SHA-256 校验和清单
          #
          # 注意：`-Include` 必须配合带通配符的路径或 `-Recurse` 才生效。
          # 写成 `-Path "dist"` 时 PowerShell 不会应用 `-Include` 过滤，结果是**一个文件都匹配不到**，
          # 于是清单会静默变成空文件（已在本机用 5 组变体实测确认：`-Path "dist"` → 0 命中，
          # `-Path "dist\*"` / `-Recurse` → 3 命中）。而报告 §4.3 正是把本清单当作产物字节一致性的
          # 兜底校验手段，空清单等于该兜底失效，因此这里既修正过滤写法、又加 fail-closed 守卫。
          $artifacts = Get-ChildItem -Path "dist\*" -File -Include "*.exe", "*.zip"
          if (-not $artifacts) {
              Write-Error "未能匹配到任何待校验产物（dist 为空或 -Include 未生效），拒绝生成空 SHA-256 清单"
              exit 1
          }
          $artifacts | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
          } | Out-File -FilePath "dist/sha256sums.txt" -Encoding ascii

      # ── Authenticode 代码签名（本轮未启用，仅保留模板）──────────────────────
      # 报告 P2-02 / §11 三-1：同一工作流自生成的 sha256 清单只能证明“产物未被改动”，
      # 不能证明发布者身份；稳定版发布要求「签名 + 验签 + 时间戳」三者齐备并作为硬门禁。
      # 用户已决定本轮不启用（2026-10-14），因此以下步骤全部保持注释，
      # 不引入任何实际签名/验签动作，也不新增 secrets 引用。
      # 启用前需准备代码签名证书并把口令放入 secrets
      # （如 WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD），然后取消注释：
      #
      # - name: 对可执行文件签名
      #   shell: pwsh
      #   run: |
      #     $pfx = "$env:RUNNER_TEMP\qp.pfx"
      #     [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX_BASE64 }}"))
      #     & signtool.exe sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" dist\QuickPath.exe
      #
      # - name: 对可执行文件验签（签名 + 时间戳均须有效，作为发布硬门禁）
      #   shell: pwsh
      #   run: |
      #     # /pa 用默认验证策略、/v 输出详情；验签失败退出码非 0，直接中止发布。
      #     # 时间戳服务器（RFC 3161，如 http://timestamp.digicert.com）不可用时会产生
      #     # 无时间戳的短命签名，证书过期后即失效，故时间戳与签名同样必须校验通过。
      #     & signtool.exe verify /pa /v dist\QuickPath.exe

      - name: 自动创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: "QuickPath ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/QuickPath-*.exe
            dist/QuickPath-*.zip
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
