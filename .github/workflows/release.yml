name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release for Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4.2.2

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 启用 Rust 编译缓存
        uses: Swatinem/rust-cache@v2.7.7

      - name: 质量门禁：执行单元与集成测试
        run: cargo test --all-targets

      - name: 编译 Release 版本
        run: cargo build --release

      - name: 整理打包产物与生成 SHA-256 清单
        shell: pwsh
        run: |
          $TAG_NAME = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path "dist"
          
          # 复制并生成规范命名的独立 exe
          Copy-Item "target/release/quickpath.exe" "dist/QuickPath-$TAG_NAME-x64.exe"
          Copy-Item "target/release/quickpath.exe" "dist/QuickPath.exe"
          
          # 生成便携压缩包
          Compress-Archive -Path "dist/QuickPath.exe" -DestinationPath "dist/QuickPath-$TAG_NAME-windows-x64.zip"
          
          # 生成严谨的 SHA-256 校验和清单
          Get-ChildItem -Path "dist" -File -Include "*.exe", "*.zip" | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
          } | Out-File -FilePath "dist/sha256sums.txt" -Encoding ascii

      - name: 自动创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2.2.1
        with:
          name: "QuickPath ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/QuickPath-*.exe
            dist/QuickPath-*.zip
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
