name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release for Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 编译缓存
        uses: Swatinem/rust-cache@v2

      - name: 编译 Release 版本
        run: cargo build --release

      - name: 整理打包产物
        shell: pwsh
        run: |
          $TAG_NAME = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path "dist"
          
          # 复制并生成规范命名的独立 exe
          Copy-Item "target/release/quickpath.exe" "dist/QuickPath-$TAG_NAME-x64.exe"
          Copy-Item "target/release/quickpath.exe" "dist/QuickPath.exe"
          
          # 生成便携压缩包
          Compress-Archive -Path "dist/QuickPath.exe" -DestinationPath "dist/QuickPath-$TAG_NAME-windows-x64.zip"

      - name: 自动创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: "QuickPath ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/QuickPath-*.exe
            dist/QuickPath-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
